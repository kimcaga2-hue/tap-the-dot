  <style>
    :root { --ink:#f9f7ff; --cyan:#54e6ff; --gold:#ffd54a; --panel:rgba(14,20,68,.74); }
    * { box-sizing:border-box; }
    body {
      width:100%; min-height:100%; margin:0; color:var(--ink); font-family:"DM Sans",sans-serif;
      background:#070a23; overflow-x:hidden;
    }
    .space-shell {
      width:100%; min-height:calc(100 * min(var(--vh, 1vh), 1vh)); padding:clamp(1rem,4vw,2.5rem);
      display:grid; place-items:center; position:relative; overflow:hidden; isolation:isolate;

    }
    .space-shell::before {
      content:""; position:absolute; inset:0; z-index:-1; opacity:.7; pointer-events:none;
      background-image:radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.4px),radial-gradient(circle,rgba(84,230,255,.72) 0 1px,transparent 1.5px);
      background-size:74px 74px,133px 133px; background-position:6px 12px,54px 33px;
    }
    .game-frame { width:min(100%,720px); }
    .game-brand { font-family:"Fraunces",serif; letter-spacing:-.05em; text-shadow:0 0 28px rgba(84,230,255,.3); }
    .hud-panel {
      background:var(--panel); border:1px solid rgba(173,191,255,.23); border-radius:1rem;
      box-shadow:0 18px 45px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(14px);
    }
    .game-stage {
      position:relative; overflow:hidden; aspect-ratio:16/10; min-height:300px; border-radius:1.35rem;
      border:1px solid rgba(141,221,255,.36); background:linear-gradient(145deg,#111859,#06092b);
      box-shadow:0 28px 65px rgba(0,0,0,.35),0 0 48px rgba(68,143,255,.12);
    }
    .game-stage::before {
      content:""; position:absolute; inset:0; pointer-events:none; opacity:.38;
      background-image:radial-gradient(circle,rgba(255,255,255,.8) 0 1px,transparent 1.3px);
      background-size:58px 58px;
    }
    .dot {
      position:absolute; width:clamp(46px,8vw,64px); height:clamp(46px,8vw,64px); border:0; border-radius:999px;
      display:none; place-items:center; cursor:pointer; touch-action:manipulation;
      background:var(--cyan); box-shadow:0 0 0 7px rgba(84,230,255,.15),0 0 28px rgba(84,230,255,.95);
      transform:translate(-50%,-50%); transition:transform .12s ease,filter .12s ease;
    }
    .dot:hover { filter:brightness(1.15); transform:translate(-50%,-50%) scale(1.08); }
    .dot:active { transform:translate(-50%,-50%) scale(.9); }
    .dot:focus-visible,.main-button:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    .dot.is-visible { display:grid; animation:dot-pop .18s ease-out; }
    @keyframes dot-pop { from { opacity:0; transform:translate(-50%,-50%) scale(.5); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
    .gameover {
      position:absolute; inset:0; display:none; place-items:center; padding:1.5rem; text-align:center;
      background:rgba(4,6,29,.7); backdrop-filter:blur(5px);
    }
    .gameover.is-visible { display:grid; }
    .gameover-card {
      width:min(100%,350px); padding:1.7rem; border-radius:1.15rem; border:1px solid rgba(186,226,255,.28);
      background:linear-gradient(145deg,rgba(28,36,101,.95),rgba(10,13,52,.96)); box-shadow:0 20px 55px rgba(0,0,0,.42);
    }
    .main-button {
      min-height:3.3rem; padding:.75rem 1.4rem; border:0; border-radius:.85rem; cursor:pointer;
      font:inherit; font-weight:700; transition:transform .16s ease,filter .16s ease;
    }
    .main-button:hover { filter:brightness(1.1); transform:translateY(-2px); }

    .stat-value { font-variant-numeric:tabular-nums; }
    .hidden-label { display:none; }
    @media (max-width:560px) {

 <body data-template-id="__page-root" style="background: rgb(7, 10, 35);">
  <div class="space-shell">
   <main class="game-frame" aria-labelledby="game-title">
    <header class="mb-4 text-center">
     <p data-template-id="eyebrow" class="canva-text mb-1 text-xs font-bold uppercase tracking-[0.22em]" style="color: rgb(114, 233, 255); font-weight: 700; font-style: normal; font-size: 16px; letter-spacing: 0.12rem;">Quick reflex game</p>
     <h1 id="game-title" data-template-id="game-title-text" class="canva-text game-brand font-extrabold" style="color: rgb(255, 255, 255); font-weight: 800; font-style: normal; font-size: 32px;">Tap the Dot</h1>
    </header>
    <section data-template-id="status-panel" class="canva-panel hud-panel mb-3 grid grid-cols-2 divide-x divide-white/10 p-3 sm:p-4" aria-label="Game status" style="background: rgba(14, 20, 68, 0.74);">
     <div class="text-center">
      <p data-template-id="score-label" class="canva-text text-xs font-bold uppercase tracking-wider" style="color: rgb(185, 192, 230); font-weight: 700; font-style: normal; font-size: 16px;">Score</p>
      <p id="score-value" class="stat-value mt-1 text-2xl font-bold text-white" aria-live="polite">0</p>
     </div>
     <div class="text-center">
      <p data-template-id="timer-label" class="canva-text text-xs font-bold uppercase tracking-wider" style="color: rgb(185, 192, 230); font-weight: 700; font-style: normal; font-size: 16px;">Time</p>
      <p id="timer-value" class="stat-value mt-1 text-2xl font-bold text-white" aria-live="polite">30</p>
     </div>
    </section>
    <section id="play-area" data-template-id="play-area" class="canva-panel game-stage" aria-label="Tap the Dot play area" style="background: linear-gradient(145deg, rgb(17, 24, 89), rgb(6, 9, 43));"><button id="dot" class="dot" type="button" aria-label="Tap the dot"> <span class="sr-only">Dot</span> </button>
     <div id="gameover" class="gameover" aria-live="polite">
      <div class="gameover-card">
       <p class="mb-2 text-4xl" aria-hidden="true">✦</p>
       <h2 data-template-id="gameover-heading" class="canva-text mb-2 font-bold" style="color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 24px;">Time's up!</h2>
       <p data-template-id="gameover-copy" class="canva-text mb-2" style="color: rgb(203, 211, 255); font-weight: 600; font-style: normal; font-size: 16px;">Final score</p>
       <p id="final-score" class="mb-1 text-5xl font-bold text-yellow-300">0</p>
      </div>
     </div>
    </section>
    <div class="mt-4 text-center"><button id="game-button" data-template-id="game-button" class="canva-button main-button w-full sm:w-auto" type="button" style="background: rgb(84, 230, 255); color: rgb(7, 18, 51);"> <span id="start-label" data-template-id="start-label" class="canva-text" style="color: rgb(7, 18, 51); font-weight: 700; font-style: normal; font-size: 16px;">Start game</span> <span id="restart-label" data-template-id="restart-label" class="canva-text hidden-label" style="color: rgb(7, 18, 51); font-weight: 700; font-style: normal; font-size: 16px;">Restart game</span> </button>
     <p data-template-id="instruction-copy" class="canva-text mt-3 text-sm" style="color: rgb(196, 205, 245); font-weight: 400; font-style: normal; font-size: 16px;">Tap the glowing dot as many times as you can in 30 seconds.</p>
    </div>
   </main>
  </div>
  <script>
    (() => {
      const area = document.getElementById("play-area");
      const dot = document.getElementById("dot");
      const button = document.getElementById("game-button");
      const scoreEl = document.getElementById("score-value");
      const timerEl = document.getElementById("timer-value");
      const gameover = document.getElementById("gameover");
      const finalScore = document.getElementById("final-score");
      const startLabel = document.getElementById("start-label");
      const restartLabel = document.getElementById("restart-label");

      let score = 0;
      let remaining = 30;
      let active = false;
      let timerId = null;

      function updateStats() {
        scoreEl.textContent = score;
        timerEl.textContent = remaining;
      }

      function placeDot() {
        const dotSize = dot.offsetWidth || 56;
        const rect = area.getBoundingClientRect();
        const pad = dotSize / 2 + 10;
        const x = pad + Math.random() * Math.max(1, rect.width - pad * 2);
        const y = pad + Math.random() * Math.max(1, rect.height - pad * 2);
        dot.style.left = x + "px";
        dot.style.top = y + "px";
      }

      function endGame() {
        active = false;
        clearInterval(timerId);
        dot.classList.remove("is-visible");
        finalScore.textContent = score;
        gameover.classList.add("is-visible");
        startLabel.classList.add("hidden-label");
        restartLabel.classList.remove("hidden-label");
      }

      function startGame() {
        clearInterval(timerId);
        score = 0;
        remaining = 30;
        active = true;
        updateStats();
        gameover.classList.remove("is-visible");
        dot.classList.add("is-visible");
        placeDot();

        timerId = setInterval(() => {
          remaining -= 1;
          updateStats();
          if (remaining <= 0) endGame();
        }, 1000);
      }

      button.addEventListener("click", startGame);
      dot.addEventListener("click", () => {
        if (!active) return;
        score += 1;
        updateStats();
        placeDot();
      });

      window.addEventListener("resize", () => {
        if (active) placeDot();
      });
    })();
  </script>
